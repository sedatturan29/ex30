name: EX30 Reader derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tek HTML'yi oluştur ve uygulamaya kopyala
        run: |
          python3 tools/build.py
          rm -f android-app/app/src/main/assets/*.html
          cp ex30-reader.html android-app/app/src/main/assets/

      - name: EX30 Reader derle
        working-directory: android-app
        run: gradle assemblePhoneDebug bundleCarRelease --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: |
          cp android-app/app/build/outputs/apk/phone/debug/app-phone-debug.apk EX30-Reader.apk
          cp android-app/app/build/outputs/bundle/carRelease/app-car-release.aab EX30-Reader-Play.aab

      - uses: actions/upload-artifact@v4
        with:
          name: EX30-Reader
          path: |
            EX30-Reader.apk
            EX30-Reader-Play.aab

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: EX30 Reader 2.${{ github.run_number }}
          body: |
            EX30-Reader.apk: telefon, Android Auto ve orta ekran için tek uygulama.
            EX30-Reader-Play.aab: yalnızca Google Play'e (orta ekran iç test kanalı) yüklemek için.
            Her zaman son sürüm: https://github.com/${{ github.repository }}/releases/latest/download/EX30-Reader.apk
          files: |
            EX30-Reader.apk
            EX30-Reader-Play.aab
          make_latest: true
