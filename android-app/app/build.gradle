plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.ex30.batarya'
    compileSdk 35
    useLibrary 'android.car'

    defaultConfig {
        applicationId 'com.ex30.batarya'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1." + runNumber
    }

    // phone: telefon + Android Auto · car: orta ekran (Android Automotive OS, Play Store)
    flavorDimensions 'form'
    productFlavors {
        phone { dimension 'form' }
        car {
            dimension 'form'
            targetSdk 35
            versionCode 100000 + runNumber
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }

    // Sabit imza: yeni sürümler eskisinin üzerine kaldırmadan kurulabilsin
    signingConfigs {
        fixed {
            storeFile file('ex30.keystore')
            storePassword 'ex30batarya'
            keyAlias 'ex30'
            keyPassword 'ex30batarya'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { signingConfig signingConfigs.fixed; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android Auto (Car App Library)
    implementation 'androidx.car.app:app:1.4.0'
}
