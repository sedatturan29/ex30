plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.ex30.batarya'
    compileSdk 35
    useLibrary 'android.car'

    defaultConfig {
        applicationId 'com.ex30.batarya'
        minSdk 26
        targetSdk 35
        // 2.x = EX30 Reader. Kod 200000+ olduğu için hem eski telefon hem eski orta ekran
        // sürümünün üzerine kaldırmadan kurulur.
        versionCode 200000 + runNumber
        versionName "2." + runNumber
    }

    // phone: TEK APK — telefon, Android Auto ve orta ekran (doğrudan kurulum)
    // car: yalnızca Google Play'e (Android Automotive OS kanalı) yüklenecek .aab'yi üretir
    flavorDimensions 'form'
    productFlavors {
        phone { dimension 'form' }
        car {
            dimension 'form'
            versionCode 200000 + runNumber
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }

    // Sabit imza: yeni sürümler eskisinin üzerine kaldırmadan kurulabilsin
    signingConfigs {
        fixed {
            storeFile file('ex30.keystore')
            storePassword 'ex30batarya'
            keyAlias 'ex30'
            keyPassword 'ex30batarya'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release { signingConfig signingConfigs.fixed; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Android Auto (Car App Library)
    implementation 'androidx.car.app:app:1.4.0'
}
